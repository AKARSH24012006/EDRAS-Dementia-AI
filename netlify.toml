# Netlify config for the repo root: builds only the React frontend.
# The site runs fully in demo mode without a backend. To use the real Flask API,
# set VITE_API_BASE_URL in Netlify > Site configuration > Environment variables.
[build]
  base = "edras-system/frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
